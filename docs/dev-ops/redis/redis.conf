# =============================================================================
# Redis 配置（挂载到容器内 /usr/local/etc/redis/redis.conf）
# 容器启动命令：redis-server /usr/local/etc/redis/redis.conf
# =============================================================================

# 监听所有网卡 —— 容器内必须如此，否则宿主机无法通过端口映射访问
bind 0.0.0.0

# 关闭保护模式：保护模式只在无密码且未 bind 时生效，容器场景下由网络层隔离
protected-mode no

port 6379

# AOF 持久化：项目用它做会话与任务状态的缓存，重启后需要能恢复
appendonly yes
appendfsync everysec

# RDB 快照
save 900 1
save 300 10

# 内存上限与淘汰策略：缓存场景允许淘汰旧键
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
